<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="476" viewBox="0 0 1280 476" role="img" aria-labelledby="title desc">
<title id="title">From one origin stack to a customer-specific deployment</title>
<desc id="desc">Your existing origin stack and each customer’s cloud, networking and service configuration feed Tensor9 BYOC compilation. The resulting deployment stack is reviewed and deployed to an appliance running your app in the customer’s infrastructure.</desc>
<rect width="1280" height="476" rx="16" fill="#ffffff"/>
<defs><style>text{font-family:Inter,Arial,Helvetica,sans-serif}</style>
<marker id="arrow" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="8.5" refY="5" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="24" y="43" font-size="31" font-weight="600" fill="#1e293b" text-anchor="start">One origin stack. A deployment for each customer.</text>
<text x="24" y="77" font-size="21" font-weight="400" fill="#475569" text-anchor="start">Keep your existing application and infrastructure definitions.</text>
<rect x="24" y="120" width="250" height="164" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
<g transform="translate(45 141)" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 9-9 10 9 10m16-20 9 10-9 10M23 3l-6 32"/></g>
<text x="45" y="220" font-size="25" font-weight="600" fill="#1e293b" text-anchor="start">Origin stack</text>
<text x="45" y="251" font-size="19" font-weight="400" fill="#475569" text-anchor="start">Your app + existing IaC</text>
<rect x="352" y="120" width="240" height="164" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<g transform="translate(373 141)" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="30" height="8" rx="2"/><rect x="2" y="16" width="22" height="8" rx="2"/><path d="M2 33h17m9-5 7 5-7 5"/></g>
<text x="373" y="220" font-size="25" font-weight="600" fill="#1e293b" text-anchor="start">Tensor9 BYOC</text>
<text x="373" y="251" font-size="18" font-weight="400" fill="#475569" text-anchor="start">Compile for the customer</text>
<rect x="674" y="120" width="250" height="164" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
<g transform="translate(695 139)" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 1h20l9 9v29H6zM26 1v10h9M13 19h15m-15 7h15m-15 7h9"/></g>
<text x="695" y="220" font-size="24" font-weight="600" fill="#1e293b" text-anchor="start">Deployment stack</text>
<text x="695" y="251" font-size="18" font-weight="400" fill="#475569" text-anchor="start">Generated infrastructure</text>
<rect x="1006" y="120" width="250" height="164" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<g transform="translate(1028 141)" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 32h22a9 9 0 0 0 1-18 13 13 0 0 0-25-2A10 10 0 0 0 9 32Z"/><path d="m15 22 4 4 8-9"/></g>
<text x="1027" y="220" font-size="23" font-weight="600" fill="#1e293b" text-anchor="start">Customer appliance</text>
<text x="1027" y="251" font-size="17" font-weight="400" fill="#475569" text-anchor="start">Your app, customer-hosted</text>
<path d="M274 202H344" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M592 202H666" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M924 202H998" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="965" y="167" font-size="15" font-weight="500" fill="#475569" text-anchor="middle">Review</text>
<text x="965" y="186" font-size="15" font-weight="500" fill="#475569" text-anchor="middle">+ deploy</text>
<rect x="352" y="350" width="400" height="104" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
<g transform="translate(372 379)" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9h34M2 21h34M2 33h34"/><circle cx="12" cy="9" r="4"/><circle cx="27" cy="21" r="4"/><circle cx="16" cy="33" r="4"/></g>
<text x="427" y="389" font-size="24" font-weight="600" fill="#1e293b" text-anchor="start">Customer configuration</text>
<text x="427" y="423" font-size="18" font-weight="400" fill="#475569" text-anchor="start">Cloud · network · services · access</text>
<path d="M472 350V292" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1131" y="323" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">CUSTOMER INFRASTRUCTURE</text>
</svg>
